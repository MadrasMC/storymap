<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>.storyblk viewer</title>
<meta name="description" content="Browse the block sprites Storymap draws for its isometric view, from a .storyblk file.">
<meta name="theme-color" content="#f6f6f3">
<link rel="canonical" href="https://madrasmc.ftrs.im/storymap/storyblk/viewer">
<meta property="og:type" content="website">
<meta property="og:title" content=".storyblk viewer">
<meta property="og:description" content="Browse the block sprites Storymap draws for its isometric view, from a .storyblk file.">
<meta property="og:url" content="https://madrasmc.ftrs.im/storymap/storyblk/viewer">
<meta property="og:image" content="https://madrasmc.ftrs.im/storymap/storyblk/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="An oak tree on a patch of grass, flowers and stone, drawn from Storymap's block sprites.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preload" href="geist.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="geist-mono.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<script type="module" src="main.js"></script>
</head>
<body>

<header class="bar">
	<h1 class="title">
		<img src="icon.svg" alt="" width="20" height="20">
		<span>.storyblk</span>
	</h1>
	<a class="spec" href="https://github.com/MadrasMC/storymap/blob/master/docs/storyblk/spec.md" target="_blank" rel="noopener">Spec</a>
	<input id="search" class="search" type="search" placeholder="Block code" aria-label="Block code" autocomplete="off" spellcheck="false">
	<select id="filter" class="filter" aria-label="Filter">
		<option value="all">All</option>
		<option value="shape">Shapes</option>
		<option value="alternates">Several shapes</option>
		<option value="turns">Turned</option>
		<option value="variants">Variants</option>
		<option value="tinted">Tinted</option>
	</select>
	<button id="open" class="button open" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="open-menu">Open</button>
</header>

<div id="open-menu" class="menu" popover="manual" role="menu">
	<button type="button" role="menuitem" data-action="file">File…</button>
	<button type="button" role="menuitem" data-action="close" id="close-file">Close</button>
</div>

<main id="empty" class="state">
	<div class="panel">
		<h2>Drop a .storyblk here</h2>
		<p><code>prepared.storyblk</code></p>
		<div class="actions">
			<button type="button" class="button primary" data-action="file">Choose file</button>
		</div>
	</div>
</main>

<main id="loading" class="state" hidden>
	<div class="panel">
		<h2 id="loading-title">Reading</h2>
		<p id="loading-detail"></p>
	</div>
</main>

<main id="blocks" hidden></main>

<footer class="status">
	<button id="file-name" class="file-button" type="button" aria-haspopup="dialog" title="Details" hidden>
		<svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.25" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 7.5V11M8 5h.01" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
		<span id="file-label" class="file-label"></span>
	</button>
	<span id="count" class="count"></span>
	<div id="zoom" class="zoom" role="group" aria-label="Zoom">
		<button type="button" data-zoom="1" aria-pressed="false">1×</button>
		<button type="button" data-zoom="2" aria-pressed="true">2×</button>
		<button type="button" data-zoom="3" aria-pressed="false">3×</button>
		<button type="button" data-zoom="4" aria-pressed="false">4×</button>
	</div>
</footer>

<dialog id="detail" aria-labelledby="detail-code">
	<div class="detail">
		<header class="detail-bar">
			<div class="detail-title">
				<h2 id="detail-code"></h2>
			</div>
			<button id="previous" class="icon-button" type="button" aria-label="Previous block">‹</button>
			<button id="next" class="icon-button" type="button" aria-label="Next block">›</button>
			<button id="close" class="icon-button" type="button" aria-label="Close">×</button>
		</header>
		<div id="detail-sprites" class="detail-sprites"></div>
		<footer id="detail-meta" class="detail-meta"></footer>
	</div>
</dialog>

<dialog id="file" aria-labelledby="file-title">
	<div class="detail">
		<header class="detail-bar">
			<div class="detail-title">
				<h2 id="file-title"></h2>
			</div>
			<button id="file-close" class="icon-button" type="button" aria-label="Close">×</button>
		</header>
		<div id="file-body" class="file-body"></div>
	</div>
</dialog>

<div id="drop" class="drop" popover="manual" aria-hidden="true">
	<div class="drop-panel">Drop to open</div>
</div>

<div id="toast" class="toast" popover="manual" role="status" aria-live="polite"></div>

<input id="pick-file" type="file" hidden>

</body>
</html>
