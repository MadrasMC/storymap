<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Storymap</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23efe4c6'/%3E%3Cpath d='M3 11 6 6l3 3 2-2 2 4z' fill='%235c462e'/%3E%3C/svg%3E">
<style>
	/* The map itself. Where it sits on the page and everything drawn around it are the theme's. */
	* { box-sizing: border-box; }
	[hidden] { display: none !important; }
	html, body { margin: 0; height: 100%; overflow: hidden; }
	#map { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; outline: none; }
	#map.dragging { cursor: grabbing; }
	#tiles { position: absolute; inset: 0; }
	#tiles img { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; user-select: none; }
	/* Zoomed in past one tile pixel per screen pixel, blocks show as crisp squares. */
	#tiles.pixelated img { image-rendering: pixelated; }
</style>
<style id="theme-style"></style>
</head>
<body>
<main id="map" tabindex="0" role="application" aria-roledescription="map" aria-label="Map. Arrow keys move, plus and minus zoom, 0 shows the whole map.">
	<div id="tiles"></div>
</main>
<script id="map-data" type="application/json">null</script>
<script>
// The map: its tiles, the camera, panning and zooming, and the place in the address. Everything
// around it is drawn by a theme, which registers with Storymap.theme() and is told whenever the
// view changes; docs/themes.md describes what it's given. Storymap inlines the theme below.
window.Storymap = { theme: start };
function start(makeTheme) {
	"use strict";
	const q = (selector) => document.querySelector(selector);
	const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
	const mapEl = q("#map");
	const layer = q("#tiles");
	const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

	// Storymap writes the map's description into the page: a browser opening it straight from
	// the disk won't let it fetch map.json beside it.
	let data = null;
	try {
		data = JSON.parse(q("#map-data").textContent);
	} catch {
		data = null;
	}
	const valid = data && data.world && Array.isArray(data.views) && data.views.length > 0;
	const world = valid ? data.world : null;
	const view = valid ? data.views[0] : null;
	const rendered = valid ? new Date(data.rendered) : null;
	if (world?.name) document.title = `${world.name} · Storymap`;

	// The map as a theme sees it. Positions are the game's, relative to the world's centre, and
	// screen positions are in pixels from the map's top-left corner.
	let stopped = false;
	const map = {
		element: mapEl,
		world: world && { name: world.name, gameVersion: world.gameVersion },
		view: view && { name: view.name, title: view.title },
		rendered: rendered && !Number.isNaN(rendered.getTime()) ? rendered : null,
		zoomIn: () => stopped || zoomStep(1),
		zoomOut: () => stopped || zoomStep(-1),
		fit: () => stopped || fit(),
		toScreen: (x, z) => ({ x: (x + centreX - cam.x) * cam.s + W / 2, y: (z + centreZ - cam.y) * cam.s + H / 2 }),
		toGame: (sx, sy) => ({ x: cam.x + (sx - W / 2) / cam.s - centreX, z: cam.y + (sy - H / 2) / cam.s - centreZ }),
	};
	const theme = makeTheme(map);

	function fail(text) {
		stopped = true;
		mapEl.setAttribute("aria-label", text);
		theme.fail(text);
	}
	if (!valid) {
		fail("No map here yet. Render a save into this folder with Storymap, then open this page again.");
		return;
	}
	if (view.projection !== "topdown") {
		fail(`This viewer can't show the “${view.title}” view.`);
		return;
	}
	const T = view.tileSize;
	// Each level's tiles, so only tiles that exist are asked for.
	const levels = view.tiles.map((flat) => {
		const set = new Set();
		for (let i = 0; i < flat.length; i += 2) set.add(`${flat[i]},${flat[i + 1]}`);
		return set;
	});
	if (!levels.length || !levels[0].size) {
		fail("This world has no fully generated areas to show yet.");
		return;
	}
	const top = levels.length - 1;

	// Positions are in level-0 pixels, which in the top-down view are blocks: x east, y south.
	// The game shows them relative to the world's centre.
	const centreX = Math.floor(world.width / 2);
	const centreZ = Math.floor(world.length / 2);
	let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
	const full = view.tiles[0];
	for (let i = 0; i < full.length; i += 2) {
		minX = Math.min(minX, full[i] * T);
		maxX = Math.max(maxX, (full[i] + 1) * T);
		minY = Math.min(minY, full[i + 1] * T);
		maxY = Math.max(maxY, (full[i + 1] + 1) * T);
	}

	// The camera: the level-0 pixel at the centre of the screen, and screen pixels per level-0
	// pixel.
	const cam = { x: (minX + maxX) / 2, y: (minY + maxY) / 2, s: 1 };
	let W = 0;
	let H = 0;
	// The map's top-left corner in the window, where the theme places it, so pointer positions
	// are measured from here.
	const origin = { x: 0, y: 0 };
	// Past four screen pixels to a block, zooming only makes the pixels bigger.
	const maxScale = 4;
	// Zoom steps are whole magnifications, the powers of two; two zooms closer than this are too
	// close to be separate steps.
	const closeStep = 1.2;
	const isWhole = (s) => Number.isInteger(Math.log2(s));
	// The view of the whole map: the explored area filling 92% of the screen's tighter side. Close
	// to a whole step it snaps to it, down, or up while the area still fits, so the buttons don't
	// take a tiny step away from it; otherwise it's a step of its own between two whole ones.
	function fitScale() {
		const fits = Math.min(W / (maxX - minX), H / (maxY - minY));
		const s = fits * 0.92;
		const below = 2 ** Math.floor(Math.log2(s));
		if (s / below < closeStep) return below;
		if ((below * 2) / s < closeStep && below * 2 <= fits) return below * 2;
		return s;
	}
	// Whether the zoom is the view of the whole map, and whether that's a step of its own, which the
	// address writes as "fit".
	const atFit = () => Math.abs(cam.s / fitScale() - 1) < 1e-6;
	const atOwnFit = () => !isWhole(fitScale()) && atFit();
	// The farthest zoom: the whole step at or below half the view of the whole map, so zooming out
	// step by step lands on it.
	const minScale = () => 2 ** Math.floor(Math.log2(Math.min(fitScale(), 1) / 2));
	function settle() {
		cam.s = clamp(cam.s, minScale(), maxScale);
		cam.x = clamp(cam.x, minX, maxX);
		cam.y = clamp(cam.y, minY, maxY);
		redraw();
		saveSoon();
	}
	function fit() {
		// A zoom step still under way would carry on from here.
		cancelAnimationFrame(animation);
		heading = 0;
		cam.x = (minX + maxX) / 2;
		cam.y = (minY + maxY) / 2;
		cam.s = fitScale();
		settle();
	}

	// Tiles, by "level/x/y": each image is asked for once and kept while it's useful. A tile that
	// can't load is left out, and only the console says so, unless none load at all.
	const cache = new Map();
	let failed = 0;
	let loadedAny = false;
	function tile(level, x, y) {
		const key = `${level}/${x}/${y}`;
		let entry = cache.get(key);
		if (!entry) {
			const img = new Image();
			img.alt = "";
			img.decoding = "async";
			img.draggable = false;
			entry = { img, state: "loading" };
			img.onload = () => {
				entry.state = "loaded";
				loadedAny = true;
				redraw();
			};
			img.onerror = () => {
				entry.state = "failed";
				failed++;
				console.warn(`storymap: couldn't load ${img.src}`);
				redraw();
			};
			img.src = `${view.name}/${key}.png`;
			cache.set(key, entry);
		}
		return entry;
	}

	let frame = 0;
	function redraw() {
		if (!frame) frame = requestAnimationFrame(draw);
	}
	function draw() {
		frame = 0;
		if (stopped) return;
		const ratio = window.devicePixelRatio || 1;
		// The level whose pixels are closest to screen pixels without being smaller than them.
		const level = clamp(Math.floor(Math.log2(1 / (cam.s * ratio))), 0, top);
		const span = T * 2 ** level;
		const left = cam.x - W / 2 / cam.s;
		const right = cam.x + W / 2 / cam.s;
		const upper = cam.y - H / 2 / cam.s;
		const lower = cam.y + H / 2 / cam.s;
		const placed = new Set();
		const now = performance.now();
		let pending = 0;
		let fading = false;
		for (let ty = Math.floor(upper / span); ty <= Math.floor(lower / span); ty++) {
			for (let tx = Math.floor(left / span); tx <= Math.floor(right / span); tx++) {
				if (!levels[level].has(`${tx},${ty}`)) continue;
				const entry = tile(level, tx, ty);
				if (entry.state === "loaded") {
					place(entry.img, level, tx, ty, placed);
					// While it fades in, the tile standing in for it stays underneath, so the
					// paper doesn't show through.
					if (!(entry.img.fadingUntil > now)) continue;
					fading = true;
				}
				if (entry.state === "loading") pending++;
				// Until it's in, the nearest loaded tile above it stands in, drawn larger.
				for (let up = level + 1, ax = tx >> 1, ay = ty >> 1; up <= top; up++, ax >>= 1, ay >>= 1) {
					const above = cache.get(`${up}/${ax}/${ay}`);
					if (above && above.state === "loaded") {
						place(above.img, up, ax, ay, placed);
						break;
					}
				}
			}
		}
		for (const img of [...layer.children]) if (!placed.has(img)) img.remove();
		// Once the fades are over, the tiles standing in under them can go.
		if (fading) setTimeout(redraw, 160);
		layer.classList.toggle("pixelated", cam.s * ratio > 1.01);
		trimCache(placed);
		if (failed && !loadedAny && !pending) {
			fail("The map's tiles couldn't be loaded. Keep this page in the folder Storymap wrote it to, next to its tile folders.");
			return;
		}
		watchLoading(pending);
		report();
	}
	// Edges are rounded to whole pixels, so neighbouring tiles meet without hairline gaps.
	function place(img, level, x, y, placed) {
		if (placed.has(img)) return;
		const span = T * 2 ** level;
		const x0 = Math.round((x * span - cam.x) * cam.s + W / 2);
		const x1 = Math.round(((x + 1) * span - cam.x) * cam.s + W / 2);
		const y0 = Math.round((y * span - cam.y) * cam.s + H / 2);
		const y1 = Math.round(((y + 1) * span - cam.y) * cam.s + H / 2);
		img.style.transform = `translate(${x0}px, ${y0}px)`;
		img.style.width = `${x1 - x0}px`;
		img.style.height = `${y1 - y0}px`;
		// More detailed levels go on top of the ones standing in for them.
		img.style.zIndex = String(top - level + 1);
		if (img.parentNode !== layer) {
			layer.append(img);
			// A tile fades in the first time it's shown. It's only ever taken away off screen or
			// under the tiles that replace it, so it never needs to fade out.
			if (!img.dataset.shown && !reduceMotion.matches) {
				img.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 150, easing: "ease-out" });
				img.fadingUntil = performance.now() + 150;
			}
			img.dataset.shown = "1";
		}
		placed.add(img);
	}
	function trimCache(placed) {
		if (cache.size <= 512) return;
		for (const [key, entry] of cache) {
			if (cache.size <= 384) break;
			if (entry.state !== "loading" && !placed.has(entry.img)) cache.delete(key);
		}
	}

	// Whether tiles are still loading, after a short wait, so quick loads never show as loading.
	let loadingTimer = 0;
	let loading = false;
	function watchLoading(pending) {
		if (pending && !loadingTimer) {
			loadingTimer = setTimeout(() => {
				loadingTimer = -1;
				loading = true;
				report();
			}, 250);
		}
		if (!pending) {
			clearTimeout(loadingTimer);
			loadingTimer = 0;
			loading = false;
		}
	}

	// What the theme draws from, after every redraw and whenever the pointer moves: the zoom, the
	// position under the pointer (or at the centre without one), the map's size and place on the
	// page, whether it's the view of the whole map, and whether tiles are still loading.
	let pointer = null;
	function report() {
		if (stopped || !W) return;
		const at = map.toGame(pointer ? pointer.x : W / 2, pointer ? pointer.y : H / 2);
		theme.update({
			scale: cam.s,
			centre: map.toGame(W / 2, H / 2),
			position: { x: Math.floor(at.x), z: Math.floor(at.z) },
			width: W,
			height: H,
			left: origin.x,
			top: origin.y,
			fit: atFit(),
			loading,
		});
	}

	// Zooming keeps the point under (sx, sy) where it is.
	function zoomAt(sx, sy, factor) {
		const px = cam.x + (sx - W / 2) / cam.s;
		const py = cam.y + (sy - H / 2) / cam.s;
		cam.s = clamp(cam.s * factor, minScale(), maxScale);
		cam.x = px - (sx - W / 2) / cam.s;
		cam.y = py - (sy - H / 2) / cam.s;
		settle();
	}
	// The buttons, keys and double-clicks step between whole magnifications (1 : 4, 1 : 2, 1 : 1,
	// 2 : 1, 4 : 1) and the whole map's own step, if it has one, from wherever the wheel or a
	// pinch left the zoom, skipping a step too close to it. A step taken while another is still
	// moving goes on from where that one is heading.
	let animation = 0;
	let heading = 0;
	function zoomStep(direction, sx = W / 2, sy = H / 2) {
		const from = heading || cam.s;
		const steps = [];
		for (let s = minScale(); s <= maxScale; s *= 2) steps.push(s);
		const whole = fitScale();
		if (!isWhole(whole) && whole > minScale() && whole < maxScale) steps.push(whole);
		steps.sort((a, b) => a - b);
		const to = direction > 0
			? steps.find((s) => s > from * closeStep) ?? maxScale
			: steps.findLast((s) => s < from / closeStep) ?? minScale();
		cancelAnimationFrame(animation);
		if (reduceMotion.matches) return zoomAt(sx, sy, to / cam.s);
		heading = to;
		const start = performance.now();
		const s0 = cam.s;
		const step = (now) => {
			const t = Math.min((now - start) / 160, 1);
			const eased = 1 - (1 - t) ** 3;
			// Evenly in magnification: each frame's scale is part of the way from s0 to the step.
			zoomAt(sx, sy, s0 * (to / s0) ** eased / cam.s);
			if (t < 1) animation = requestAnimationFrame(step);
			else heading = 0;
		};
		animation = requestAnimationFrame(step);
	}

	// Dragging pans; two fingers pinch to zoom.
	const pointers = new Map();
	mapEl.addEventListener("pointerdown", (e) => {
		mapEl.setPointerCapture(e.pointerId);
		pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
		mapEl.classList.add("dragging");
	});
	mapEl.addEventListener("pointermove", (e) => {
		if (stopped) return;
		if (e.pointerType === "mouse") pointer = { x: e.clientX - origin.x, y: e.clientY - origin.y };
		const last = pointers.get(e.pointerId);
		if (!last) return report();
		if (pointers.size === 1) {
			cam.x -= (e.clientX - last.x) / cam.s;
			cam.y -= (e.clientY - last.y) / cam.s;
		} else if (pointers.size === 2) {
			const [a, b] = [...pointers.values()];
			const other = a === last ? b : a;
			const before = Math.hypot(last.x - other.x, last.y - other.y);
			const after = Math.hypot(e.clientX - other.x, e.clientY - other.y);
			// The midpoint moves by half of this finger's move: pan by that, then zoom around it.
			cam.x -= (e.clientX - last.x) / 2 / cam.s;
			cam.y -= (e.clientY - last.y) / 2 / cam.s;
			pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
			if (before > 0) zoomAt((e.clientX + other.x) / 2 - origin.x, (e.clientY + other.y) / 2 - origin.y, after / before);
			else settle();
			return;
		}
		pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
		settle();
	});
	const release = (e) => {
		pointers.delete(e.pointerId);
		if (!pointers.size) mapEl.classList.remove("dragging");
	};
	mapEl.addEventListener("pointerup", release);
	mapEl.addEventListener("pointercancel", release);
	mapEl.addEventListener("pointerleave", (e) => {
		if (e.pointerType === "mouse") {
			pointer = null;
			report();
		}
	});
	mapEl.addEventListener("wheel", (e) => {
		e.preventDefault();
		if (stopped) return;
		// Lines and pages scroll in bigger steps than pixels.
		const delta = e.deltaY * (e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 800 : 1);
		zoomAt(e.clientX - origin.x, e.clientY - origin.y, Math.exp(-delta * 0.0015));
	}, { passive: false });
	mapEl.addEventListener("dblclick", (e) => stopped || zoomStep(e.shiftKey ? -1 : 1, e.clientX - origin.x, e.clientY - origin.y));

	const panKeys = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] };
	document.addEventListener("keydown", (e) => {
		if (stopped || e.ctrlKey || e.metaKey || e.altKey) return;
		const pan = panKeys[e.key.length === 1 ? e.key.toLowerCase() : e.key];
		if (pan) {
			const step = (e.shiftKey ? 0.6 : 0.2) * Math.min(W, H) / cam.s;
			cam.x += pan[0] * step;
			cam.y += pan[1] * step;
			settle();
		} else if (e.key === "+" || e.key === "=") {
			zoomStep(1);
		} else if (e.key === "-" || e.key === "_") {
			zoomStep(-1);
		} else if (e.key === "0" || e.key === "Home") {
			fit();
		} else {
			return;
		}
		e.preventDefault();
	});

	// The position lives in the address, as the game's x and z and the zoom as a scale of screen
	// pixels to blocks (#512,-512,2:1 or #512,-512,1:8, or "fit" for the whole map at a step of its
	// own, which depends on the screen), so reloading or sharing the link keeps the place. The
	// address keeps two decimals, so a zoom between steps comes back as it was.
	let saveTimer = 0;
	function saveSoon() {
		clearTimeout(saveTimer);
		saveTimer = setTimeout(() => {
			const zoom = atOwnFit()
				? "fit"
				: cam.s >= 1 ? `${Number(cam.s.toFixed(2))}:1` : `1:${Number((1 / cam.s).toFixed(2))}`;
			const hash = `#${Math.floor(cam.x) - centreX},${Math.floor(cam.y) - centreZ},${zoom}`;
			if (hash !== location.hash) history.replaceState(null, "", hash);
		}, 300);
	}
	function restore() {
		const parts = location.hash.slice(1).split(",");
		if (parts.length !== 3) return false;
		const [x, z] = parts.slice(0, 2).map(Number);
		const [pixels, blocks] = parts[2].split(":");
		const s = parts[2] === "fit" ? fitScale() : Number(pixels) / Number(blocks);
		if (![x, z, s].every(Number.isFinite) || s <= 0) return false;
		cam.x = x + centreX + 0.5;
		cam.y = z + centreZ + 0.5;
		cam.s = s;
		settle();
		return true;
	}
	window.addEventListener("hashchange", () => stopped || restore());

	let started = false;
	new ResizeObserver(() => {
		if (stopped) return;
		// The view of the whole map stays the whole map when the window changes shape.
		const wasFit = started && atFit();
		W = mapEl.clientWidth;
		H = mapEl.clientHeight;
		const box = mapEl.getBoundingClientRect();
		origin.x = box.left + mapEl.clientLeft;
		origin.y = box.top + mapEl.clientTop;
		theme.resize?.();
		if (!started) {
			started = true;
			if (!restore()) fit();
		} else if (wasFit) {
			fit();
		} else {
			settle();
		}
	}).observe(mapEl);
}
</script>
<script id="theme-script"></script>
</body>
</html>
