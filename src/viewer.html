	:root {
		font-size: 16px;
		--sans: "Geist", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
		--mono: "Geist Mono", ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
		/* The title is set like an old map's: serif capitals, from the system's fonts. */
		--serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
		--t-micro: 0.625rem;
		--t-small: 0.8125rem;
		--t-body: 0.9375rem;
		--s1: 0.25rem;
		--s2: 0.5rem;
		--s3: 0.75rem;
		--s4: 1rem;
		--radius: 0.25rem;
		/* The paper the tiles are drawn on: their empty pixels are transparent. */
		--paper: #efe4c6;
		/* Panels are lighter paper and opaque, so they read over busy terrain. */
		--panel: #faf6ea;
		--ink: #3a2c1e;
		--fg: #2b2117;
		--muted: #7a6a52;
		--border: rgb(92 70 46 / 0.3);
		--rule: rgb(92 70 46 / 0.16);
		--lift: 0 1px 2px rgb(60 40 20 / 0.12), 0 4px 12px rgb(60 40 20 / 0.08);
		/* The hairline just inside the ink edge of the cartouche and the zoom key. */
		--ruled: inset 0 0 0 3px var(--panel), inset 0 0 0 4px var(--border);
		/* The accent has one job: the control you're on. */
		--accent: #5c462e;
		/* The paper margin around the sheet, wide enough for the grid's coordinates. */
		--margin: clamp(1.25rem, 3vw, 2rem);
		--inset: calc(var(--margin) + var(--s3));
		/* The outer rule, a little outside the sheet; the grid's coordinates sit halfway between it and the screen's edge. */
		--neatline: calc(var(--margin) - 0.3125rem);
		color-scheme: light;
	}
	* { box-sizing: border-box; }
	[hidden] { display: none !important; }
	html, body { margin: 0; height: 100%; overflow: hidden; background: var(--paper); color: var(--fg); font: var(--t-body)/1.4 var(--sans); }

	/* The sheet: the map inside a double neatline, the inner rule its own edge. */
	#map {
		position: fixed; inset: var(--margin); overflow: hidden; touch-action: none; cursor: grab; outline: none;
		border: 1px solid var(--ink);
	}
	.neatline { position: fixed; inset: var(--neatline); border: 1.5px solid var(--ink); pointer-events: none; }
	#map.dragging { cursor: grabbing; }
	#map:focus-visible { box-shadow: inset 0 0 0 2px var(--accent); }
	#tiles { position: absolute; inset: 0; }
	#tiles img { position: absolute; left: 0; top: 0; transform-origin: 0 0; pointer-events: none; user-select: none; }
	/* Zoomed in past one tile pixel per screen pixel, blocks show as crisp squares. */
	#tiles.pixelated img { image-rendering: pixelated; }
	#grid { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 100; pointer-events: none; }
	#grid path { fill: none; stroke: var(--ink); stroke-opacity: 0.2; stroke-width: 1; }
	/* The grid's coordinates, in the margin, as printed maps label theirs. */
	.ticks span {
		position: fixed; font: var(--t-micro)/1 var(--mono); font-variant-numeric: tabular-nums;
		color: var(--muted); white-space: nowrap; pointer-events: none;
	}
	.ticks .x { top: calc(var(--neatline) / 2 - var(--t-micro) / 2); transform: translateX(-50%); }
	.ticks .x.end { top: auto; bottom: calc(var(--neatline) / 2 - var(--t-micro) / 2); }
	.ticks .z { left: calc(var(--neatline) / 2); transform: translate(-50%, -50%) rotate(-90deg); }
	.ticks .z.end { left: auto; right: calc(var(--neatline) / 2); transform: translate(50%, -50%) rotate(90deg); }

	.panel { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--lift); }
	/* The title cartouche: a double-ruled box, as on the old map's corner. */
	.title {
		position: fixed; top: var(--inset); left: var(--inset); max-width: calc(100vw - 2 * var(--inset));
		margin: 0; padding: var(--s3) var(--s4); text-align: center;
		background: var(--panel); border: 1px solid var(--ink); box-shadow: var(--ruled), var(--lift);
	}
	/* Set as an old cartographer would: "A top-down view of", then the world's name. */
	.title .kind { display: block; font: italic var(--t-small)/1.2 var(--serif); color: var(--muted); }
	/* A long name wraps to three balanced lines, then ends in an ellipsis. */
	.title .name {
		display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3; line-clamp: 3; overflow: hidden;
		max-width: 30ch; margin: 0.3125rem auto; font: 500 1.5rem/1.1 var(--serif); letter-spacing: 0.1em; text-transform: uppercase;
		color: var(--ink); text-wrap: balance;
	}
	/* A cut-short name shows in full when the cartouche is tapped, as wide as the screen allows. */
	.title.truncated { cursor: pointer; }
	.title:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
	.title.open { z-index: 1; max-height: calc(100dvh - 2 * var(--inset)); overflow: auto; }
	.title.open .name { display: block; max-width: none; white-space: normal; -webkit-line-clamp: none; line-clamp: none; }
	/* While it resizes, the lines keep their final width and the box reveals them. */
	.title.sizing { overflow: hidden; }
	.title.sizing > span { width: var(--content-width); }
	.title .version { display: block; font: 600 var(--t-micro)/1.4 var(--sans); letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); }
	.title .rendered { display: block; font: italic var(--t-small)/1.3 var(--serif); color: var(--muted); }
	.title .version:empty, .title .rendered:empty { display: none; }
	/* The coordinates above the scale, so neither pushes the other as it changes. */
	.readout {
		position: fixed; left: var(--inset); bottom: var(--inset); max-width: calc(100vw - 2 * var(--inset) - 4.25rem);
		display: flex; flex-direction: column; align-items: flex-start; gap: var(--s2); padding: var(--s2) var(--s3);
		font: var(--t-small)/1 var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap;
	}
	.readout .k { color: var(--muted); }
	/* A bar the length of a round number of blocks, in alternating ink and paper, like a printed map's scale. */
	.scale { display: flex; align-items: center; gap: var(--s2); }
	.scale i {
		display: block; height: 0.3125rem; border: 1px solid var(--ink);
		background: linear-gradient(90deg, var(--ink) 0 25%, transparent 25% 50%, var(--ink) 50% 75%, transparent 75%);
	}
	.scale span, #status { font-family: var(--sans); color: var(--muted); }
	#status:empty { display: none; }
	@media (max-width: 30rem) {
		/* On a phone the cartouche shrinks, so it doesn't cover the map. */
		.title { padding: var(--s2) var(--s3); }
		.title .name { display: block; max-width: none; font-size: 1.25rem; letter-spacing: 0.08em; white-space: nowrap; text-overflow: ellipsis; }
	}
	/* The zoom key, ruled like the cartouche: hills as old maps draw them, one big hill to come
	   closer and small ones to stand back, with the zoom between them showing the whole map. */
	.controls {
		position: fixed; right: var(--inset); bottom: var(--inset); display: grid; padding: 0.375rem;
		background: var(--panel); border: 1px solid var(--ink); box-shadow: var(--ruled), var(--lift);
	}
	.controls button {
		/* The hills are filled with the button's own colour, so they hide what's behind them. */
		--bg: var(--panel);
		position: relative; width: 2.75rem; height: 2.5rem; display: grid; place-items: center; padding: 0;
		border: 0; background: var(--bg); color: var(--ink); cursor: pointer; font: inherit;
	}
	.controls button:hover:not(:disabled) { --bg: #ede8db; }
	.controls button:active:not(:disabled) { --bg: #e1dacc; }
	.controls button:disabled { opacity: 0.5; cursor: default; }
	.controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
	.hills { width: 2rem; height: 1.375rem; overflow: visible; }
	.hills .o { fill: var(--bg); stroke: currentColor; stroke-width: 1.1; stroke-linecap: round; vector-effect: non-scaling-stroke; }
	.hills .h { fill: none; stroke: currentColor; stroke-width: 0.7; vector-effect: non-scaling-stroke; }
	/* Small arrows as if drawn with a pen, at the hill's top right. */
	.arrow {
		position: absolute; top: 0.3125rem; right: 0.125rem; width: 0.5rem; height: 0.625rem; overflow: visible;
		fill: none; stroke: currentColor; stroke-width: 1.1; stroke-linecap: round; stroke-linejoin: round;
	}
	/* The zoom as a printed scale, 1 : 16, set on its colon: the colon stays in the middle and the
	   numbers grow away from it, so nothing shifts as they change or the ≈ comes and goes. */
	.controls .zoom { height: 2rem; font: var(--t-small)/1 var(--serif); font-variant-numeric: lining-nums tabular-nums; color: var(--muted); white-space: nowrap; }
	#zoom { justify-self: stretch; display: grid; grid-template-columns: 1fr auto 1fr; align-items: baseline; }
	#zoom > :first-child { text-align: right; }
	#zoom > :nth-child(2) { margin: 0 0.1875rem; }
	#zoom > :last-child { text-align: left; }
	#zoom b { font-weight: normal; font-size: 0.9375rem; margin-right: 0.0625rem; }
	/* The whole map at a step of its own: a small range of hills in a faint frame, for the number. */
	.zoom .mark { display: none; padding: 0.125rem 0.1875rem; border: 1px solid var(--border); }
	.zoom .mark .hills { display: block; width: 1.375rem; height: 0.9375rem; }
	.zoom.whole .mark { display: block; }
	.zoom.whole #zoom { display: none; }
	.message {
		position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
		width: min(24rem, calc(100vw - 2 * var(--inset))); margin: 0; padding: var(--s4) 1.25rem;
		line-height: 1.5; text-align: center; text-wrap: balance;
	}
</style>
</head>
<body>
<main id="map" tabindex="0" role="application" aria-roledescription="map" aria-label="Map. Arrow keys move, plus and minus zoom, 0 shows the whole map.">
	<div id="tiles"></div>
	<svg id="grid" aria-hidden="true"><path id="grid-lines"/></svg>
</main>
<div class="neatline" aria-hidden="true"></div>
<div class="ticks" id="ticks" aria-hidden="true"></div>
<h1 class="title" id="title"><span class="kind" id="kind">A view of</span><span class="name" id="name">storymap</span><span class="version" id="version"></span><span class="rendered" id="rendered"></span></h1>
<div class="panel readout">
	<span id="coords" aria-hidden="true"></span>
	<span class="scale" aria-hidden="true"><i id="scale-bar"></i><span id="scale-label"></span></span>
	<span id="status" role="status"></span>
</div>
<div class="controls">
	<button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in (+)">
		<svg class="hills" viewBox="-14 -16 28 18" aria-hidden="true">
			<g transform="scale(1.1)"><path class="o" d="M-10 0C-6 -1 -3 -12 0 -12C3 -12 6 -1 10 0"/><path class="h" d="M1.5 -11L1 0M3.5 -9L3.5 0M5.5 -6L6 0M7.5 -3L8 0"/></g>
		</svg>
		<svg class="arrow" viewBox="0 0 8 10" aria-hidden="true"><path d="M4.3 9.4C3.7 7.6 4.5 5.6 3.9 3"/><path d="M1.2 5.6C2.1 4.7 3 3.7 3.8 2.6"/><path d="M3.5 2.3C4.5 3.4 5.6 4.3 6.9 5"/></svg>
	</button>
	<button type="button" class="zoom" id="fit" aria-label="Show the whole map" title="Whole map (0)">
		<span id="zoom"></span>
		<span class="mark">
			<svg class="hills" viewBox="-14 -16 28 18" aria-hidden="true">
				<path class="o" transform="translate(-4 -5.5) scale(0.42)" d="M-10 0C-6 -1 -3 -12 0 -12C3 -12 6 -1 10 0"/>
				<path class="o" transform="translate(4.5 -5) scale(0.38)" d="M-10 0C-6 -1 -3 -12 0 -12C3 -12 6 -1 10 0"/>
				<path class="o" transform="translate(-8.5 0) scale(0.45)" d="M-10 0C-6 -1 -3 -12 0 -12C3 -12 6 -1 10 0"/>
				<path class="o" transform="scale(0.5)" d="M-10 0C-6 -1 -3 -12 0 -12C3 -12 6 -1 10 0"/>
				<path class="o" transform="translate(8.5 0) scale(0.42)" d="M-10 0C-6 -1 -3 -12 0 -12C3 -12 6 -1 10 0"/>
			</svg>
		</span>
	</button>
	<button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out (−)">
		<svg class="hills" viewBox="-14 -16 28 18" aria-hidden="true">
			<g transform="translate(-5.5 0) scale(0.55)"><path class="o" d="M-10 0C-6 -1 -3 -12 0 -12C3 -12 6 -1 10 0"/><path class="h" d="M1.5 -11L1 0M3.5 -9L3.5 0M5.5 -6L6 0M7.5 -3L8 0"/></g>
			<g transform="translate(5.5 0) scale(0.55)"><path class="o" d="M-10 0C-6 -1 -3 -12 0 -12C3 -12 6 -1 10 0"/><path class="h" d="M1.5 -11L1 0M3.5 -9L3.5 0M5.5 -6L6 0M7.5 -3L8 0"/></g>
			<g transform="translate(0 -4) scale(0.45)"><path class="o" d="M-10 0C-6 -1 -3 -12 0 -12C3 -12 6 -1 10 0"/><path class="h" d="M1.5 -11L1 0M3.5 -9L3.5 0M5.5 -6L6 0M7.5 -3L8 0"/></g>
		</svg>
		<svg class="arrow" viewBox="0 0 8 10" aria-hidden="true"><path d="M3.7 0.8C4.5 3.2 3.5 5.4 4.2 7.6"/><path d="M1.1 5.1C2 6.1 3.1 7 4.3 8"/><path d="M4 8.3C4.8 7.2 5.8 6.3 6.9 5.5"/></svg>
	</button>
</div>
<p class="panel message" id="message" role="alert" hidden></p>
<script id="map-data" type="application/json">null</script>
<script>
(() => {
	"use strict";
	const $ = (selector) => document.querySelector(selector);
	const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
	const mapEl = $("#map");
	const layer = $("#tiles");
	const coordsEl = $("#coords");
	const statusEl = $("#status");
	const buttons = [...document.querySelectorAll(".controls button")];
	const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");

	function fail(text) {
		const message = $("#message");
		message.textContent = text;
		message.hidden = false;
		$(".readout").hidden = true;
		$("#ticks").hidden = true;
		$("#grid-lines").removeAttribute("d");
		for (const button of buttons) button.disabled = true;
		mapEl.setAttribute("aria-label", text);
	}

	// storymap writes the map's description into the page: a browser opening it straight from
	// the disk won't let it fetch map.json beside it.
	let data = null;
	try {
		data = JSON.parse($("#map-data").textContent);
	} catch {
		data = null;
	}
	if (!data || !data.world || !Array.isArray(data.views) || !data.views.length) {
		fail("No map here yet. Render a save into this folder with storymap, then open this page again.");
		return;
	}
	const world = data.world;
	if (world.name) {
		document.title = `${world.name} · storymap`;
		$("#name").textContent = world.name;
	}
	const view = data.views[0];
	// The cartouche: the kind of map, the world, and what it was made from and when.
	$("#kind").textContent = `A ${view.title.toLowerCase()} view of`;
	if (world.gameVersion) $("#version").textContent = `Vintage Story ${world.gameVersion}`;
	const rendered = new Date(data.rendered);
	if (!Number.isNaN(rendered.getTime())) $("#rendered").textContent = `Rendered ${rendered.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })}`;

	// A name cut short opens the cartouche to show it in full; tapping again, outside or Escape closes it.
	const titleEl = $("#title");
	const nameEl = $("#name");
	let titleOpen = false;
	let sizing = null;
	function checkTruncated() {
		if (titleOpen || sizing) return;
		// Accents and descenders reach past the line box, so only a hidden line counts as cut short.
		const line = parseFloat(getComputedStyle(nameEl).lineHeight);
		const cut = nameEl.scrollWidth > nameEl.clientWidth + 1 || nameEl.scrollHeight > nameEl.clientHeight + line / 2;
		titleEl.classList.toggle("truncated", cut);
		if (cut) titleEl.tabIndex = 0;
		else titleEl.removeAttribute("tabindex");
	}
	function openTitle(open) {
		if (open === titleOpen || (open && !titleEl.classList.contains("truncated"))) return;
		titleOpen = open;
		// Turned around mid-way, it starts from where it is.
		const now = titleEl.getBoundingClientRect();
		const turning = sizing !== null;
		if (sizing) {
			sizing.cancel();
			sizing = null;
			titleEl.classList.remove("sizing");
		}
		// The box animates between its two sizes while showing the full name, which closing removes at the end.
		titleEl.classList.add("open");
		const full = titleEl.getBoundingClientRect();
		const contentWidth = nameEl.getBoundingClientRect().width;
		titleEl.classList.remove("open");
		const cut = titleEl.getBoundingClientRect();
		titleEl.classList.add("open");
		if (reduceMotion.matches) {
			titleEl.classList.toggle("open", open);
			return;
		}
		const [from, to] = open ? [turning ? now : cut, full] : [turning ? now : full, cut];
		titleEl.style.setProperty("--content-width", `${contentWidth}px`);
		titleEl.classList.add("sizing");
		sizing = titleEl.animate(
			[{ width: `${from.width}px`, height: `${from.height}px` }, { width: `${to.width}px`, height: `${to.height}px` }],
			{ duration: 200, easing: open ? "cubic-bezier(0.2, 0, 0, 1)" : "cubic-bezier(0.3, 0, 0.8, 0.15)", fill: "forwards" },
		);
		const animation = sizing;
		animation.finished.then(() => {
			if (sizing !== animation) return;
			titleEl.classList.remove("sizing");
			titleEl.classList.toggle("open", open);
			animation.cancel();
			sizing = null;
		}, () => {});
	}
	titleEl.addEventListener("click", () => openTitle(!titleOpen));
	titleEl.addEventListener("keydown", (e) => {
		if (e.key === "Enter" || e.key === " ") openTitle(!titleOpen);
		else if (e.key === "Escape") openTitle(false);
		else return;
		e.preventDefault();
		e.stopPropagation();
	});
	document.addEventListener("pointerdown", (e) => {
		if (!titleEl.contains(e.target)) openTitle(false);
	}, true);
	document.addEventListener("keydown", (e) => {
		if (e.key === "Escape") openTitle(false);
	});
	new ResizeObserver(checkTruncated).observe(titleEl);
	window.addEventListener("resize", checkTruncated);
	checkTruncated();
	if (view.projection !== "topdown") {
		fail(`This viewer can't show the “${view.title}” view.`);
		return;
	}
	const T = view.tileSize;
	// Each level's tiles, so only tiles that exist are asked for.
	const levels = view.tiles.map((flat) => {
		const set = new Set();
		for (let i = 0; i < flat.length; i += 2) set.add(`${flat[i]},${flat[i + 1]}`);
		return set;
	});
	if (!levels.length || !levels[0].size) {
		fail("This world has no fully generated areas to show yet.");
		return;
	}
	const top = levels.length - 1;

	// Positions are in level-0 pixels, which in the top-down view are blocks: x east, y south.
	// The game shows them relative to the world's centre.
	const centreX = Math.floor(world.width / 2);
	const centreZ = Math.floor(world.length / 2);
	let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
	const full = view.tiles[0];
	for (let i = 0; i < full.length; i += 2) {
		minX = Math.min(minX, full[i] * T);
		maxX = Math.max(maxX, (full[i] + 1) * T);
		minY = Math.min(minY, full[i + 1] * T);
		maxY = Math.max(maxY, (full[i + 1] + 1) * T);
	}

	// The camera: the level-0 pixel at the centre of the screen, and screen pixels per level-0
	// pixel.
	const cam = { x: (minX + maxX) / 2, y: (minY + maxY) / 2, s: 1 };
	let W = 0;
	let H = 0;
	// The map's top-left corner in the window: it sits inside the paper margin, so pointer
	// positions are measured from here.
	const origin = { x: 0, y: 0 };
	// Past four screen pixels to a block, zooming only makes the pixels bigger.
	const maxScale = 4;
	// Zoom steps are whole magnifications, the powers of two; two zooms closer than this are too
	// close to be separate steps.
	const closeStep = 1.2;
	const isWhole = (s) => Number.isInteger(Math.log2(s));
	// The view of the whole map: the explored area filling 92% of the screen's tighter side. Close
	// to a whole step it snaps to it, down, or up while the area still fits, so the buttons don't
	// take a tiny step away from it; otherwise it's a step of its own between two whole ones.
	function fitScale() {
		const fits = Math.min(W / (maxX - minX), H / (maxY - minY));
		const s = fits * 0.92;
		const below = 2 ** Math.floor(Math.log2(s));
		if (s / below < closeStep) return below;
		if ((below * 2) / s < closeStep && below * 2 <= fits) return below * 2;
		return s;
	}
	// Whether the view is the whole map at a step of its own, which the page shows with a mark
	// rather than a number.
	const atOwnFit = () => !isWhole(fitScale()) && Math.abs(cam.s / fitScale() - 1) < 1e-6;
	// The farthest zoom: the whole step at or below half the view of the whole map, so zooming out
	// step by step lands on it.
	const minScale = () => 2 ** Math.floor(Math.log2(Math.min(fitScale(), 1) / 2));
	function settle() {
		cam.s = clamp(cam.s, minScale(), maxScale);
		cam.x = clamp(cam.x, minX, maxX);
		cam.y = clamp(cam.y, minY, maxY);
		redraw();
		saveSoon();
	}
	function fit() {
		// A zoom step still under way would carry on from here.
		cancelAnimationFrame(animation);
		heading = 0;
		cam.x = (minX + maxX) / 2;
		cam.y = (minY + maxY) / 2;
		cam.s = fitScale();
		settle();
	}

	// Tiles, by "level/x/y": each image is asked for once and kept while it's useful. A tile that
	// can't load is left out, and only the console says so, unless none load at all.
	const cache = new Map();
	let failed = 0;
	let loadedAny = false;
	function tile(level, x, y) {
		const key = `${level}/${x}/${y}`;
		let entry = cache.get(key);
		if (!entry) {
			const img = new Image();
			img.alt = "";
			img.decoding = "async";
			img.draggable = false;
			entry = { img, state: "loading" };
			img.onload = () => {
				entry.state = "loaded";
				loadedAny = true;
				redraw();
			};
			img.onerror = () => {
				entry.state = "failed";
				failed++;
				console.warn(`storymap: couldn't load ${img.src}`);
				redraw();
			};
			img.src = `${view.name}/${key}.png`;
			cache.set(key, entry);
		}
		return entry;
	}

	let frame = 0;
	function redraw() {
		if (!frame) frame = requestAnimationFrame(draw);
	}
	function draw() {
		frame = 0;
		const ratio = window.devicePixelRatio || 1;
		// The level whose pixels are closest to screen pixels without being smaller than them.
		const level = clamp(Math.floor(Math.log2(1 / (cam.s * ratio))), 0, top);
		const span = T * 2 ** level;
		const left = cam.x - W / 2 / cam.s;
		const right = cam.x + W / 2 / cam.s;
		const upper = cam.y - H / 2 / cam.s;
		const lower = cam.y + H / 2 / cam.s;
		const placed = new Set();
		const now = performance.now();
		let pending = 0;
		let fading = false;
		for (let ty = Math.floor(upper / span); ty <= Math.floor(lower / span); ty++) {
			for (let tx = Math.floor(left / span); tx <= Math.floor(right / span); tx++) {
				if (!levels[level].has(`${tx},${ty}`)) continue;
				const entry = tile(level, tx, ty);
				if (entry.state === "loaded") {
					place(entry.img, level, tx, ty, placed);
					// While it fades in, the tile standing in for it stays underneath, so the
					// paper doesn't show through.
					if (!(entry.img.fadingUntil > now)) continue;
					fading = true;
				}
				if (entry.state === "loading") pending++;
				// Until it's in, the nearest loaded tile above it stands in, drawn larger.
				for (let up = level + 1, ax = tx >> 1, ay = ty >> 1; up <= top; up++, ax >>= 1, ay >>= 1) {
					const above = cache.get(`${up}/${ax}/${ay}`);
					if (above && above.state === "loaded") {
						place(above.img, up, ax, ay, placed);
						break;
					}
				}
			}
		}
		for (const img of [...layer.children]) if (!placed.has(img)) img.remove();
		// Once the fades are over, the tiles standing in under them can go.
		if (fading) setTimeout(redraw, 160);
		layer.classList.toggle("pixelated", cam.s * ratio > 1.01);
		trimCache(placed);
		if (failed && !loadedAny && !pending) {
			fail("The map's tiles couldn't be loaded. Keep this page in the folder storymap wrote it to, next to its tile folders.");
			return;
		}
		showStatus(pending);
		showCoords();
		showScale();
		showZoom();
		showGrid();
	}
	// Edges are rounded to whole pixels, so neighbouring tiles meet without hairline gaps.
	function place(img, level, x, y, placed) {
		if (placed.has(img)) return;
		const span = T * 2 ** level;
		const x0 = Math.round((x * span - cam.x) * cam.s + W / 2);
		const x1 = Math.round(((x + 1) * span - cam.x) * cam.s + W / 2);
		const y0 = Math.round((y * span - cam.y) * cam.s + H / 2);
		const y1 = Math.round(((y + 1) * span - cam.y) * cam.s + H / 2);
		img.style.transform = `translate(${x0}px, ${y0}px)`;
		img.style.width = `${x1 - x0}px`;
		img.style.height = `${y1 - y0}px`;
		// More detailed levels go on top of the ones standing in for them.
		img.style.zIndex = String(top - level + 1);
		if (img.parentNode !== layer) {
			layer.append(img);
			// A tile fades in the first time it's shown. It's only ever taken away off screen or
			// under the tiles that replace it, so it never needs to fade out.
			if (!img.dataset.shown && !reduceMotion.matches) {
				img.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 150, easing: "ease-out" });
				img.fadingUntil = performance.now() + 150;
			}
			img.dataset.shown = "1";
		}
		placed.add(img);
	}
	function trimCache(placed) {
		if (cache.size <= 512) return;
		for (const [key, entry] of cache) {
			if (cache.size <= 384) break;
			if (entry.state !== "loading" && !placed.has(entry.img)) cache.delete(key);
		}
	}

	// The status line: a short wait before "Loading…", so quick loads don't flash it.
	let loadingTimer = 0;
	function showStatus(pending) {
		if (pending && !loadingTimer) {
			loadingTimer = setTimeout(() => {
				loadingTimer = -1;
				showStatus(-1);
			}, 250);
		}
		if (!pending) {
			clearTimeout(loadingTimer);
			loadingTimer = 0;
		}
		statusEl.textContent = pending && loadingTimer === -1 ? "Loading…" : "";
	}

	// The scale bar: the roundest length of 1, 2 or 5 times a power of ten that's at most 8rem
	// wide on screen.
	const scaleBar = $("#scale-bar");
	const scaleLabel = $("#scale-label");
	function showScale() {
		const widest = 128 / cam.s;
		const power = 10 ** Math.floor(Math.log10(widest));
		const blocks = [5, 2, 1].map((m) => m * power).find((b) => b <= widest) ?? power;
		scaleBar.style.width = `${Math.round(blocks * cam.s)}px`;
		scaleLabel.textContent = `${blocks.toLocaleString("en")} ${blocks === 1 ? "block" : "blocks"}`;
	}

	// The zoom as a scale of screen pixels to blocks, the same for every world, written as maps and
	// drawings write theirs: 1 : 1 draws a block as one pixel, the tiles' full detail, 1 : 8 fits
	// eight blocks in a pixel, and 4 : 1 draws a block four pixels wide. A zoom the wheel or a pinch
	// left between whole numbers shows the nearest one marked as approximate (≈1 : 3); the address keeps
	// the exact value. The whole map at a step of its own shows a framed range of hills instead.
	// Pressing the zoom shows the whole map.
	const zoomEl = $("#zoom");
	const fitEl = $("#fit");
	function showZoom() {
		const whole = atOwnFit();
		fitEl.classList.toggle("whole", whole);
		if (whole) return;
		const ratio = cam.s >= 1 ? cam.s : 1 / cam.s;
		const rounded = Math.round(ratio);
		const [pixels, blocks] = cam.s >= 1 ? [rounded, 1] : [1, rounded];
		const near = Math.abs(ratio / rounded - 1) < 0.005 ? "" : "<b>≈</b>";
		const text = `<span>${near}${pixels}</span><span>:</span><span>${blocks.toLocaleString("en")}</span>`;
		if (zoomEl.innerHTML !== text) zoomEl.innerHTML = text;
	}

	// The grid: a line every round number of blocks in the game's coordinates, 90 to 225 pixels
	// apart, with the coordinates in the margin on all four sides of the sheet.
	const gridLines = $("#grid-lines");
	const ticks = $("#ticks");
	function showGrid() {
		const narrowest = 90 / cam.s;
		const power = 10 ** Math.floor(Math.log10(narrowest));
		const step = [1, 2, 5, 10].map((m) => m * power).find((b) => b >= narrowest);
		// Screen position of a game coordinate; lines sit on half pixels to stay one pixel wide.
		const sx = (x) => Math.round((x + centreX - cam.x) * cam.s + W / 2) + 0.5;
		const sy = (z) => Math.round((z + centreZ - cam.y) * cam.s + H / 2) + 0.5;
		const firstX = Math.ceil((cam.x - W / 2 / cam.s - centreX) / step) * step;
		const firstZ = Math.ceil((cam.y - H / 2 / cam.s - centreZ) / step) * step;
		const path = [];
		const labels = [];
		// Labels too near a corner would run into the other edge's.
		const clear = 24;
		for (let x = firstX; sx(x) < W; x += step) {
			path.push(`M${sx(x)} 0V${H}`);
			if (sx(x) > clear && sx(x) < W - clear) {
			const label = `style="left:${origin.x + sx(x)}px">${number(x)}</span>`;
			labels.push(`<span class="x" ${label}`, `<span class="x end" ${label}`);
		}
		}
		for (let z = firstZ; sy(z) < H; z += step) {
			path.push(`M0 ${sy(z)}H${W}`);
			if (sy(z) > clear && sy(z) < H - clear) {
			const label = `style="top:${origin.y + sy(z)}px">${number(z)}</span>`;
			labels.push(`<span class="z" ${label}`, `<span class="z end" ${label}`);
		}
		}
		gridLines.setAttribute("d", path.join(""));
		ticks.innerHTML = labels.join("");
	}

	// The position under the pointer, or the centre of the screen without one, as the game shows it.
	let pointer = null;
	const number = (n) => (n < 0 ? `−${-n}` : String(n));
	function showCoords() {
		const px = pointer ? cam.x + (pointer.x - W / 2) / cam.s : cam.x;
		const py = pointer ? cam.y + (pointer.y - H / 2) / cam.s : cam.y;
		const x = Math.floor(px) - centreX;
		const z = Math.floor(py) - centreZ;
		coordsEl.innerHTML = `<span class="k">x</span> ${number(x)} <span class="k">z</span> ${number(z)}`;
	}

	// Zooming keeps the point under (sx, sy) where it is.
	function zoomAt(sx, sy, factor) {
		const px = cam.x + (sx - W / 2) / cam.s;
		const py = cam.y + (sy - H / 2) / cam.s;
		cam.s = clamp(cam.s * factor, minScale(), maxScale);
		cam.x = px - (sx - W / 2) / cam.s;
		cam.y = py - (sy - H / 2) / cam.s;
		settle();
	}
	// The buttons, keys and double-clicks step between whole magnifications (1 : 4, 1 : 2, 1 : 1,
	// 2 : 1, 4 : 1) and the whole map's own step, if it has one, from wherever the wheel or a
	// pinch left the zoom, skipping a step too close to it. A step taken while another is still
	// moving goes on from where that one is heading.
	let animation = 0;
	let heading = 0;
	function zoomStep(direction, sx = W / 2, sy = H / 2) {
		const from = heading || cam.s;
		const steps = [];
		for (let s = minScale(); s <= maxScale; s *= 2) steps.push(s);
		const whole = fitScale();
		if (!isWhole(whole) && whole > minScale() && whole < maxScale) steps.push(whole);
		steps.sort((a, b) => a - b);
		const to = direction > 0
			? steps.find((s) => s > from * closeStep) ?? maxScale
			: steps.findLast((s) => s < from / closeStep) ?? minScale();
		cancelAnimationFrame(animation);
		if (reduceMotion.matches) return zoomAt(sx, sy, to / cam.s);
		heading = to;
		const start = performance.now();
		const s0 = cam.s;
		const step = (now) => {
			const t = Math.min((now - start) / 160, 1);
			const eased = 1 - (1 - t) ** 3;
			// Evenly in magnification: each frame's scale is part of the way from s0 to the step.
			zoomAt(sx, sy, s0 * (to / s0) ** eased / cam.s);
			if (t < 1) animation = requestAnimationFrame(step);
			else heading = 0;
		};
		animation = requestAnimationFrame(step);
	}

	// Dragging pans; two fingers pinch to zoom.
	const pointers = new Map();
	mapEl.addEventListener("pointerdown", (e) => {
		mapEl.setPointerCapture(e.pointerId);
		pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
		mapEl.classList.add("dragging");
	});
	mapEl.addEventListener("pointermove", (e) => {
		if (e.pointerType === "mouse") pointer = { x: e.clientX - origin.x, y: e.clientY - origin.y };
		const last = pointers.get(e.pointerId);
		if (!last) return showCoords();
		if (pointers.size === 1) {
			cam.x -= (e.clientX - last.x) / cam.s;
			cam.y -= (e.clientY - last.y) / cam.s;
		} else if (pointers.size === 2) {
			const [a, b] = [...pointers.values()];
			const other = a === last ? b : a;
			const before = Math.hypot(last.x - other.x, last.y - other.y);
			const after = Math.hypot(e.clientX - other.x, e.clientY - other.y);
			// The midpoint moves by half of this finger's move: pan by that, then zoom around it.
			cam.x -= (e.clientX - last.x) / 2 / cam.s;
			cam.y -= (e.clientY - last.y) / 2 / cam.s;
			pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
			if (before > 0) zoomAt((e.clientX + other.x) / 2 - origin.x, (e.clientY + other.y) / 2 - origin.y, after / before);
			else settle();
			return;
		}
		pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
		settle();
	});
	const release = (e) => {
		pointers.delete(e.pointerId);
		if (!pointers.size) mapEl.classList.remove("dragging");
	};
	mapEl.addEventListener("pointerup", release);
	mapEl.addEventListener("pointercancel", release);
	mapEl.addEventListener("pointerleave", (e) => {
		if (e.pointerType === "mouse") {
			pointer = null;
			showCoords();
		}
	});
	mapEl.addEventListener("wheel", (e) => {
		e.preventDefault();
		// Lines and pages scroll in bigger steps than pixels.
		const delta = e.deltaY * (e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 800 : 1);
		zoomAt(e.clientX - origin.x, e.clientY - origin.y, Math.exp(-delta * 0.0015));
	}, { passive: false });
	mapEl.addEventListener("dblclick", (e) => zoomStep(e.shiftKey ? -1 : 1, e.clientX - origin.x, e.clientY - origin.y));

	$("#zoom-in").addEventListener("click", () => zoomStep(1));
	$("#zoom-out").addEventListener("click", () => zoomStep(-1));
	$("#fit").addEventListener("click", fit);

	const panKeys = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1], a: [-1, 0], d: [1, 0], w: [0, -1], s: [0, 1] };
	document.addEventListener("keydown", (e) => {
		if (e.ctrlKey || e.metaKey || e.altKey) return;
		const pan = panKeys[e.key.length === 1 ? e.key.toLowerCase() : e.key];
		if (pan) {
			const step = (e.shiftKey ? 0.6 : 0.2) * Math.min(W, H) / cam.s;
			cam.x += pan[0] * step;
			cam.y += pan[1] * step;
			settle();
		} else if (e.key === "+" || e.key === "=") {
			zoomStep(1);
		} else if (e.key === "-" || e.key === "_") {
			zoomStep(-1);
		} else if (e.key === "0" || e.key === "Home") {
			fit();
		} else {
			return;
		}
		e.preventDefault();
	});

	// The position lives in the address, as the game's x and z and the zoom as the page shows it
	// (#512,-512,2:1 or #512,-512,1:8, or "fit" for the whole map at a step of its own, which
	// depends on the screen), so reloading or sharing the link keeps the place. The address keeps
	// two decimals, so a zoom between steps comes back as it was.
	let saveTimer = 0;
	function saveSoon() {
		clearTimeout(saveTimer);
		saveTimer = setTimeout(() => {
			const zoom = atOwnFit()
				? "fit"
				: cam.s >= 1 ? `${Number(cam.s.toFixed(2))}:1` : `1:${Number((1 / cam.s).toFixed(2))}`;
			const hash = `#${Math.floor(cam.x) - centreX},${Math.floor(cam.y) - centreZ},${zoom}`;
			if (hash !== location.hash) history.replaceState(null, "", hash);
		}, 300);
	}
	function restore() {
		const parts = location.hash.slice(1).split(",");
		if (parts.length !== 3) return false;
		const [x, z] = parts.slice(0, 2).map(Number);
		const [pixels, blocks] = parts[2].split(":");
		const s = parts[2] === "fit" ? fitScale() : Number(pixels) / Number(blocks);
		if (![x, z, s].every(Number.isFinite) || s <= 0) return false;
		cam.x = x + centreX + 0.5;
		cam.y = z + centreZ + 0.5;
		cam.s = s;
		settle();
		return true;
	}
	window.addEventListener("hashchange", restore);

	let started = false;
	new ResizeObserver(() => {
		W = mapEl.clientWidth;
		H = mapEl.clientHeight;
		const box = mapEl.getBoundingClientRect();
		origin.x = box.left + mapEl.clientLeft;
		origin.y = box.top + mapEl.clientTop;
		if (!started) {
			started = true;
			if (!restore()) fit();
		} else {
			settle();
		}
	}).observe(mapEl);
})();
</script>
</body>
</html>
